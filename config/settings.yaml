# 金铲铲之战 AI 屏幕监控与辅助决策系统配置

app:
  name: "JianChanChan-AI"
  version: "0.1.0"
  debug: true
  log_level: "INFO"

# 窗口捕获设置
capture:
  # 支持的模拟器 / 客户端窗口标题关键词
  window_targets:
    - "金铲铲之战"
    - "MuMu模拟器"
    - "雷电模拟器"
    - "夜神模拟器"
    - "Tencent Game Assistant"
  target_resolution:
    width: 1920
    height: 1080
  fps_limit: 10
  backend: "mss"  # 可选: mss, dxcam, win32

# 视觉识别配置
vision:
  ocr_languages: ["ch_sim", "en"]
  yolo_model_path: "data/weights/board_detector.pt"
  confidence_threshold: 0.65

# 游戏与赛季数据
game:
  current_season: "S11"
  data_dir: "data/season_data"
  pool_sizes:
    1: 22  # 1费卡每张数量 (随赛季规则调整)
    2: 20  # 2费卡
    3: 17  # 3费卡
    4: 10  # 4费卡
    5: 9   # 5费卡

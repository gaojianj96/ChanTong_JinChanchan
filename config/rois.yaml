# 1920x1080 分辨率下的标准化区域定义 (ROI: Region of Interest)
# 格式: [x1, y1, x2, y2] 或 [x, y, w, h] (此处使用 x1, y1, x2, y2 像素坐标)

base_resolution: [1920, 1080]

regions:
  # 阶段与回合信息 (例如: 2-1, 3-5)
  stage_round: [880, 10, 1040, 50]

  # 玩家基础属性 (金币、等级、经验、生命值)
  player_gold: [880, 880, 940, 920]
  player_level: [320, 880, 400, 920]
  player_hp: [1680, 880, 1750, 920]

  # 商店区域 (5个卡槽)
  shop_cards:
    slot_0: [480, 930, 680, 1070]
    slot_1: [700, 930, 900, 1070]
    slot_2: [920, 930, 1120, 1070]
    slot_3: [1140, 930, 1340, 1070]
    slot_4: [1360, 930, 1560, 1070]

  # 己方备战席 (9个槽位)
  player_bench:
    slot_0: [350, 680, 470, 800]
    slot_1: [480, 680, 600, 800]
    slot_2: [610, 680, 730, 800]
    slot_3: [740, 680, 860, 800]
    slot_4: [870, 680, 990, 800]
    slot_5: [1000, 680, 1120, 800]
    slot_6: [1130, 680, 1250, 800]
    slot_7: [1260, 680, 1380, 800]
    slot_8: [1390, 680, 1510, 800]

  # 棋盘网格整体区域 (4行 x 7列)
  board_area: [400, 240, 1520, 700]

  # 对手列表/记分板区域 (右侧头像列表)
  opponents_sidebar: [1780, 160, 1910, 880]

  # 左侧羁绊状态栏
  traits_sidebar: [10, 160, 260, 780]
